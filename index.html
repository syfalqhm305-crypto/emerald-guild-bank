<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>بنك النقابة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="boot-loading" class="loading-screen">جارِ الاتصال بالخادم...</div>

<!-- ============ LANDING ============ -->
<div id="view-landing" style="display:none;">
  <div class="landing-wrap">
    <div class="landing-hero">
      <div class="logo-holder" id="landing-logo"></div>
      <h1 id="landing-guild-name">—</h1>
      <p id="landing-tagline">—</p>
      <div class="landing-actions">
        <button class="btn btn-primary" onclick="enterApp('dashboard')">دخول البنك</button>
        <button class="btn btn-ghost" onclick="enterApp('store')">المتجر</button>
      </div>
    </div>
    <div class="landing-grid">
      <div class="card">
        <h3>مسؤول البنك</h3>
        <div id="landing-admin"></div>
      </div>
      <div class="card">
        <h3>القادة</h3>
        <div id="landing-leaders"></div>
      </div>
    </div>
    <div class="landing-foot" id="landing-foot"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="view-app" style="display:none;">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="topbar">
        <div class="search-box" id="search-ic-holder"><input id="search-input" placeholder="ابحث عن عضو أو عملية.." oninput="onSearch(this.value)"></div>
        <div class="topbar-spacer"></div>
        <div class="icon-btn" id="bell-holder"><span class="dot" id="notif-count">0</span></div>
        <div class="icon-btn" id="mail-holder"></div>
        <div class="profile-chip" id="profile-chip" onclick="openMemberSwitch()"></div>
      </div>
      <div id="page-content"></div>
      <div id="rightpanel-inline"></div>
    </main>
    <aside class="rightpanel" id="rightpanel"></aside>
  </div>

  <nav class="bottomnav" id="bottomnav">
    <a class="bn-item" data-r="dashboard" onclick="go('dashboard')"></a>
    <a class="bn-item" data-r="members" onclick="go('members')"></a>
    <div class="bn-center" onclick="go('store')"><div class="circle" id="bn-logo"></div></div>
    <a class="bn-item" data-r="prizes" onclick="go('prizes')"></a>
    <a class="bn-item" onclick="openMore()"></a>
  </nav>
</div>

<div id="modal-root"></div>
<div class="toast-wrap" id="toast-wrap"></div>

<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
